name: Pre-release (build RC)

# A GitHub *pre-release* is the validation stage: write the changelog + version
# back to main, and build the multi-arch RC image. Nothing becomes :latest yet.
on:
  release:
    types: [prereleased]

permissions:
  contents: write
  packages: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (strip leading v)
        id: v
        run: echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Changelog + version → commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make pre-release VER="${{ steps.v.outputs.ver }}"

      # Release notes = your hand-written highlights (the body you wrote when creating
      # the release) followed by the auto-generated changelog. Either part may be empty.
      - name: Compose release notes (highlights + changelog)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          HIGHLIGHTS: ${{ github.event.release.body }}
        run: |
          section=$(awk 'f && /^## / { exit } f; /^## / { f=1 }' CHANGELOG.md)
          {
            [ -n "$HIGHLIGHTS" ] && printf '%s\n\n' "$HIGHLIGHTS"
            [ -n "$section" ] && printf '## Changelog\n%s\n' "$section"
          } > .notes.md
          gh release edit "$TAG" --notes-file .notes.md
          rm -f .notes.md

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push RC image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.ver }}-rc
          cache-from: type=gha
          cache-to: type=gha,mode=max
