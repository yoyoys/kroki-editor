name: Publish image (promote)

# Flipping a pre-release to a full release promotes the already-validated RC image
# to the final tags. The same digest is re-tagged — nothing is rebuilt.
on:
  release:
    types: [released]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    # The published image is this project's deliverable, so track it as a deployment.
    # Add required reviewers under Settings → Environments → ghcr to gate publishing.
    environment:
      name: ghcr
      url: https://github.com/${{ github.repository }}/pkgs/container/kroki-editor
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version (strip leading v)
        id: v
        run: echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote RC → :<version> + :latest
        run: make release VER="${{ steps.v.outputs.ver }}"
